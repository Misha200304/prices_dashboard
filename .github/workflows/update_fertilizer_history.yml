name: Update fertilizer history

on:
  workflow_dispatch:
  schedule:
    - cron: "15 22 * * 5"

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update verified fertilizer history
        run: python backfill_fertilizer_history.py

      - name: Commit new observations
        run: |
          if git diff --quiet -- data/fertilizer_prices.csv; then
            echo "No new verified fertilizer observations."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fertilizer_prices.csv
          git commit -m "data: update verified fertilizer history"
          git push

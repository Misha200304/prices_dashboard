name: Update USDA Fertilizer Prices

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch USDA fertilizer prices
        run: python fetch_usda_prices.py --days 60
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}

      - name: Commit new USDA history
        run: |
          git config user.name "USDA Price Bot"
          git config user.email "actions@github.com"
          git add data/usda_fertilizer_prices.csv
          if git diff --cached --quiet; then
            echo "No USDA fertilizer data changes to commit."
            exit 0
          fi
          git commit -m "data: update USDA fertilizer prices"
          git push
